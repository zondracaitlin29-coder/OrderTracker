<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16875B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>My Orders</title>
<style>
:root{--bg:#FFF7ED;--g:#16875B;--gd:#0E6B46;--gl:#D9F2E4;--ink:#1F1D1A;--mut:#57534A;--card:#fff;--red:#C62828;--line:#E6D3B8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 130px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.biz{font-size:24px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.gear{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.gear svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:40px 22px;text-align:center;margin-top:24px}
.empty h2{margin:0 0 8px;font-size:24px}
.empty p{margin:0;color:var(--mut);font-size:18px}
.add{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;height:60px;background:var(--g);color:#fff;border-radius:18px;font-size:20px;font-weight:800;box-shadow:0 6px 18px #0e6b4655;z-index:5}
.add.inline{position:static;transform:none;display:block;width:100%;margin-top:22px;box-shadow:none}
.nums{display:flex;gap:12px;margin-bottom:16px}
.num{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.num small{display:block;color:var(--mut);font-size:16px}
.num b{font-size:26px;line-height:1.3}
.pill{display:block;width:100%;min-height:58px;background:var(--red);color:#fff;border-radius:30px;padding:12px 18px;font-size:20px;font-weight:800;margin-bottom:16px}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:8px;background:var(--bg);margin:0 -16px 14px;padding:8px 16px}
.tab{flex:1;height:70px;border-radius:18px;background:#fff;border:2px solid var(--line);color:var(--ink);font-size:17px;font-weight:700;line-height:1.2}
.tab span{display:block;font-size:24px;line-height:1.1}
.tab i{font-style:normal;color:var(--mut);font-weight:700}
.tab.on{background:var(--g);border-color:var(--gd);color:#fff}
.tab.on i{color:#fff}
.card{background:#FFE6CF;border:2px solid #F0C59E;border-radius:20px;padding:18px;margin-bottom:16px}
.card.ready{border-left:8px solid var(--g)}
.card.done{background:#BFE8D1;border-color:#7CC9A0}
.rl{font-weight:800;color:var(--gd);font-size:18px;margin-bottom:6px}
.nm{font-size:22px;font-weight:800;overflow-wrap:anywhere;line-height:1.25}
.it{margin:2px 0 10px;overflow-wrap:anywhere;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px}
.pr{font-size:24px;font-weight:800}
.chip{border-radius:20px;padding:5px 12px;font-size:16px;font-weight:700}
.chip.ok{background:#fff;color:var(--gd)}
.chip.warn{background:#FFF8DD;color:#6b4000}
.chip.bad{background:#fff;color:#9c1c1c}
.meta{color:var(--mut);font-size:16px;margin-bottom:12px}
.btns{display:flex;gap:10px}
.btns button{flex:1;min-height:58px;padding:10px 8px;border-radius:16px;font-size:18px;font-weight:800;background:var(--g);color:#fff}
.btns button.alt{background:#fff;color:var(--gd);border:2.5px solid var(--g)}
.btns button.mute{background:var(--gl);color:var(--gd)}
.links{margin-top:6px;color:var(--mut);display:flex;flex-wrap:wrap;align-items:center}
.lk{color:var(--gd);text-decoration:underline;font-size:17px;font-weight:600;padding:12px 10px 12px 0;min-height:46px}
.lk.del{color:var(--red)}
.sep{padding:0 8px 0 0}
#modal{position:fixed;inset:0;background:#1f1d1a77;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom))}
.sheet h2{margin:0;font-size:24px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{color:var(--gd);font-weight:800;text-decoration:underline;padding:10px 0 10px 10px;font-size:18px}
h3{margin:0 0 4px;font-size:19px}
.sec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:17px}
.sec label:first-of-type{margin-top:8px}
input,select,textarea{font:inherit;font-size:18px;width:100%;min-height:54px;padding:12px 14px;border:2px solid #cdb994;border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #16875B55;border-color:var(--g)}
.chk{display:flex;align-items:center;gap:12px;font-weight:600;margin-top:16px}
.chk input{width:28px;height:28px;min-height:0;flex:none;accent-color:var(--g)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;padding:8px 4px;border-radius:14px;background:#fff;border:2px solid #cdb994;font-size:17px;font-weight:700}
.seg button.on{background:var(--g);border-color:var(--gd);color:#fff}
.owes{margin-top:14px;font-weight:800;font-size:20px;color:var(--red)}
.owes.z{color:var(--gd)}
.more{margin-top:16px;color:var(--gd);text-decoration:underline;font-size:18px;font-weight:700;min-height:48px}
.save{width:100%;min-height:60px;margin-top:22px;background:var(--g);color:#fff;border-radius:16px;font-size:20px;font-weight:800}
.cancel{display:block;margin:6px auto 0;color:var(--mut);padding:14px;font-size:17px}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:22px}
.help ol{padding-left:24px;margin:14px 0}
.help li{margin-bottom:10px;font-size:19px}
.p{margin:8px 0 0;color:var(--mut);font-size:16px}
.two{display:flex;gap:10px;margin-top:12px}
.two button,.wide{flex:1;min-height:54px;border-radius:14px;border:2.5px solid var(--g);background:#fff;color:var(--gd);font-weight:800;font-size:17px;padding:8px}
.wide{width:100%;margin-top:8px}
.owelist div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.owelist div:last-child{border:0}
.owelist button{border:2px solid var(--g);color:var(--gd);border-radius:12px;padding:8px 12px;font-weight:800;margin-top:6px;min-height:44px}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.sum span:last-child{color:var(--gd);font-weight:700}
.cl>div{padding:14px 0;border-bottom:1px solid var(--line)}
.cl>div:last-child{border:0}
.cb{display:flex;gap:8px;margin-top:10px}
.cb button{flex:1;min-height:48px;border:2px solid var(--g);color:var(--gd);border-radius:12px;font-weight:800;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:18px;font-weight:700;z-index:30}
#toast.on{display:flex}
#toast button{color:#9be3c0;font-weight:800;font-size:18px;padding:10px 14px;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
(function(){
// ---------- PWA (manifest + service worker via Blob) ----------
try{
  var c=document.createElement('canvas');
  var ic=function(s){c.width=c.height=s;var x=c.getContext('2d');x.fillStyle='#16875B';x.fillRect(0,0,s,s);x.fillStyle='#fff';x.font='bold '+(s*.55)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u2713',s/2,s/2);return c.toDataURL('image/png')};
  var m={name:'My Orders',short_name:'Orders',start_url:location.href.split('#')[0],display:'standalone',background_color:'#FFF7ED',theme_color:'#16875B',icons:[{src:ic(192),sizes:'192x192',type:'image/png'},{src:ic(512),sizes:'512x512',type:'image/png'}]};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  var a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic(180);document.head.appendChild(a);
}catch(e){}
try{
  if('serviceWorker' in navigator){
    var sw="self.addEventListener('install',function(e){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});self.addEventListener('fetch',function(e){e.respondWith(fetch(e.request).then(function(r){var k=r.clone();caches.open('ot2').then(function(c){c.put(e.request,k)});return r}).catch(function(){return caches.match(e.request)}))});";
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(function(){});
  }
}catch(e){}

// ---------- data ----------
var K={o:'ot_orders',b:'ot_biz',h:'ot_help',s:'ot_set'};
var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
var orders=load(K.o,[]);if(!Array.isArray(orders))orders=[];
var set=load(K.s,{});
var biz='';try{biz=localStorage.getItem(K.b)||''}catch(e){}
var custList=[],tab='todo',editId=null,pay='none',deferred=null,snap=null,tt;
var $=function(s){return document.querySelector(s)};
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function save(){try{localStorage.setItem(K.o,JSON.stringify(orders))}catch(e){alert('Could not save. Your phone storage may be full.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function R(n){return 'R'+(Math.round(n*100)/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fd(d){if(!d)return '';var x=new Date(d+'T00:00:00');return isNaN(x)?'':x.getDate()+' '+M[x.getMonth()]}
function today(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function owes(o){return Math.max(0,(+o.price||0)-(+o.paid||0))}
function get(id){return orders.filter(function(o){return o.id===id})[0]}
function buzz(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function toast(m,undo){var t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button onclick="OT.undo()">Undo</button>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},5000)}
function act(id,msg,fn){var o=get(id);if(!o)return;snap=JSON.stringify(o);fn(o);save();render();buzz();toast(msg,true)}

// ---------- render ----------
var GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
function card(o){
  var ow=owes(o),pc='',pr=+o.price||0,id="'"+o.id+"'";
  if(pr>0)pc=ow<=0?'<span class="chip ok">Paid \u2713</span>':(+o.paid>0?'<span class="chip warn">Deposit '+R(o.paid)+' \u2022 Owes '+R(ow)+'</span>':'<span class="chip bad">Not paid \u2022 Owes '+R(ow)+'</span>');
  var h='<div class="card '+(o.status==='todo'?'':o.status)+'">'+(o.status==='ready'?'<div class="rl">\u2705 Ready for collection</div>':'')+'<div class="nm">'+esc(o.name)+'</div><div class="it">'+esc(o.item)+'</div><div class="row"><span class="pr">'+R(pr)+'</span>'+pc+'</div>';
  h+='<div class="meta">'+(o.due?'Due '+fd(o.due)+' \u2022 ':'')+'Ordered '+fd(o.ordered)+(o.notes?'<br>'+esc(o.notes):'')+'</div>';
  var wa='<button class="lk" onclick="OT.wa('+id+')">WhatsApp</button>',ed='<button class="lk" onclick="OT.form('+id+')">Edit</button>',dl='<button class="lk del" onclick="OT.del('+id+')">Delete</button>',sp='<span class="sep">\u2022</span>';
  if(o.status==='todo'){
    h+='<div class="btns">'+(ow>0?'<button onclick="OT.paid('+id+')">Tap Paid</button>':'<button class="mute" disabled>Paid \u2713</button>')+'<button class="alt" onclick="OT.st('+id+',\'ready\')">Mark Ready</button></div><div class="links">'+wa+sp+ed+sp+dl+'</div>';
  }else if(o.status==='ready'){
    h+='<div class="btns"><button onclick="OT.collect('+id+')">Mark Collected</button><button class="alt" onclick="OT.wa('+id+')">WhatsApp</button></div><div class="links">'+(ow>0?'<button class="lk" onclick="OT.paid('+id+')">Tap Paid if they still owe</button>'+sp:'')+ed+'</div>';
  }else{
    h+='<div class="links">'+wa+sp+ed+sp+dl+'</div>';
  }
  return h+'</div>';
}
function render(){
  var has=orders.length>0;
  var h='<div class="top"><div class="biz">'+esc(biz||'My Orders')+'</div><button class="gear" onclick="OT.set()" aria-label="Settings">'+GEAR+'</button></div>';
  if(!has){
    h+='<div class="empty"><h2>No orders yet \uD83D\uDE42</h2><p>Tap + Add Order to add your first one</p></div><button class="add inline" onclick="OT.form()">+ Add Order</button>';
  }else{
    var owed=0,got=0;orders.forEach(function(o){owed+=owes(o);got+=(+o.paid||0)});
    h+='<div class="nums"><div class="num"><small>Still owed to you</small><b>'+R(owed)+'</b></div><div class="num"><small>You have been paid</small><b>'+R(got)+'</b></div></div>';
    if(owed>0)h+='<button class="pill" onclick="OT.owing()">Who owes me? '+R(owed)+'</button>';
    var cut=new Date();cut.setDate(cut.getDate()-6);cut=new Date(cut.getTime()-cut.getTimezoneOffset()*60000).toISOString().slice(0,10);
    var wk=orders.filter(function(o){return o.ordered>=cut}).length;
    h+='<button class="sum" onclick="OT.cust()"><span>This week: <b>'+wk+'</b> order'+(wk===1?'':'s')+'</span><span><b>'+orders.length+'</b> in total \u2022 My customers \u203A</span></button>';
    var cnt={todo:0,ready:0,done:0};orders.forEach(function(o){cnt[o.status]=(cnt[o.status]||0)+1});
    h+='<div class="tabs">'+[['todo','\uD83E\uDDFA','To Do'],['ready','\u2705','Ready'],['done','\uD83C\uDF89','Done']].map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="OT.tab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+' <i>'+cnt[t[0]]+'</i></button>'}).join('')+'</div>';
    var list=orders.filter(function(o){return o.status===tab});
    list=tab==='todo'?list.slice():list.slice().reverse();
    if(!list.length)h+='<div class="empty" style="margin-top:6px;padding:28px 18px"><p>'+(tab==='todo'?'Nothing to do right now \uD83D\uDE0C':tab==='ready'?'Nothing waiting for collection':'No finished orders yet')+'</p></div>';
    else h+=list.map(card).join('');
    h+='<button class="add" onclick="OT.form()">+ Add Order</button>';
  }
  $('#app').innerHTML=h;
}

// ---------- modal ----------
function open(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on');$('#sheet').scrollTop=0}
function close(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')close()});
function eft(o){
  if(set.on===false||!set.acc)return '';
  var l=['','Pay by EFT:'];
  if(set.bank)l.push('Bank: '+set.bank);if(set.accName)l.push('Account name: '+set.accName);
  l.push('Account number: '+set.acc);if(set.branch)l.push('Branch code: '+set.branch);l.push('Reference: '+o.name);
  return '\n'+l.join('\n');
}
function send(o,msg){
  var n=String(o.phone||'').replace(/[^\d]/g,'');
  if(n.indexOf('00')===0)n=n.slice(2);
  if(n.charAt(0)==='0')n='27'+n.slice(1);
  if(n.length<9){alert('Add a phone number first (tap Edit).');return}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');
}

// ---------- actions ----------
var OT=window.OT={
  tab:function(t){tab=t;render();window.scrollTo(0,0)},
  close:close,
  undo:function(){
    if(!snap)return;var p=JSON.parse(snap),o=get(p.id);
    if(o){for(var k in p)o[k]=p[k];tab=o.status;save();render()}
    snap=null;$('#toast').classList.remove('on');
  },
  help:function(first){
    var h='<div class="help"><h2>'+(first===true?'Welcome \uD83D\uDE42':'How it works')+'</h2>';
    if(first===true)h+='<label for="wn">What is your business called?</label><input id="wn" maxlength="40" placeholder="e.g. Thandi\u2019s Cakes" value="'+esc(biz)+'">';
    h+='<ol><li>Add order</li><li>Tap Paid when they pay</li><li>Tap Ready when it\u2019s done</li><li>Tap WhatsApp to tell them</li></ol><div class="p">Save a backup once a week. You\u2019ll find it under the gear \u2699 at the top.</div>';
    open(h+'<button class="save" onclick="OT.helpDone('+(first===true)+')">'+(first===true?'Let\u2019s go':'Got it')+'</button></div>');
  },
  helpDone:function(first){
    if(first){var w=$('#wn');if(w&&w.value.trim()){biz=w.value.trim();put(K.b,biz)}put(K.h,'1');render()}
    close();
  },
  set:function(){
    var s=set;
    var h='<div class="sh"><h2>Settings</h2><button class="x" onclick="OT.close()">Close</button></div>'+
    '<button class="wide" style="margin-top:12px" onclick="OT.cust()">My customers</button>'+
    '<div class="sec"><h3>Your business</h3><label for="sb">Business name</label><input id="sb" maxlength="40" value="'+esc(biz)+'"></div>'+
    '<div class="sec"><h3>Payment details (EFT)</h3><div class="p">So customers know where to pay.</div><label for="sbk">Bank</label><input id="sbk" value="'+esc(s.bank)+'" placeholder="e.g. Capitec"><label for="san">Account name</label><input id="san" value="'+esc(s.accName)+'"><label for="sac">Account number</label><input id="sac" type="tel" inputmode="numeric" value="'+esc(s.acc)+'"><label for="sbr">Branch code</label><input id="sbr" type="tel" inputmode="numeric" value="'+esc(s.branch)+'"><label class="chk"><input type="checkbox" id="son"'+(s.on===false?'':' checked')+'>Add these to my WhatsApp messages when money is owed</label></div>'+
    '<div class="sec"><h3>Backup</h3><div class="p">Save a backup once a week.'+(s.backup?' Last backup: '+fd(s.backup)+'.':' You haven\u2019t made one yet.')+'</div><div class="two"><button onclick="OT.exp()">Download my orders</button><button onclick="OT.impPick()">Bring my orders back</button></div></div>'+
    '<div class="sec"><h3>On your phone</h3>'+(standalone?'<div class="p">Installed \u2713</div>':deferred?'<button class="wide" onclick="OT.install()">Install on my phone</button>':ios?'<div class="p">Tap Share &gt; Add to Home Screen &gt; Add</div>':'<div class="p">Open your browser menu and choose Add to Home screen.</div>')+'<button class="wide" onclick="OT.help()">How it works</button></div>'+
    '<button class="save" onclick="OT.saveSet()">Save settings</button>';
    open(h);
  },
  saveSet:function(){
    biz=$('#sb').value.trim();put(K.b,biz);
    set.bank=$('#sbk').value.trim();set.accName=$('#san').value.trim();set.acc=$('#sac').value.trim();set.branch=$('#sbr').value.trim();set.on=$('#son').checked;
    put(K.s,JSON.stringify(set));close();render();toast('Settings saved \u2713');
  },
  install:function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;close()})},
  form:function(id,pre){
    var pf=pre||{};editId=id||null;var o=id?get(id):null;
    var price=o?+o.price||0:0,paid=o?+o.paid||0:0;
    pay=!o?'none':(price>0&&paid>=price?'full':paid>0?'dep':'none');
    var names={};orders.forEach(function(x){names[x.name]=1});
    var dl=Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join('');
    var more=o&&(o.due||o.notes||o.status!=='todo');
    var h='<div class="sh"><h2>'+(o?'Edit order':'New order')+'</h2><button class="x" onclick="OT.close()">Cancel</button></div>'+
    '<label for="fn">Customer name</label><input id="fn" list="cl" autocomplete="off" value="'+esc(o?o.name:pf.name)+'" onchange="OT.fill()"><datalist id="cl">'+dl+'</datalist>'+
    '<label for="fp">Phone number</label><input id="fp" type="tel" inputmode="tel" placeholder="082 123 4567" value="'+esc(o?o.phone:pf.phone)+'">'+
    '<label for="fi">What did they order?</label><input id="fi" value="'+esc(o&&o.item)+'">'+
    '<label for="fpr">Price (R)</label><input id="fpr" type="number" inputmode="decimal" min="0" step="any" value="'+(o&&price?price:'')+'" oninput="OT.calc()">'+
    '<label>How much did they pay?</label><div class="seg"><button type="button" data-p="none" onclick="OT.pay(\'none\')">Not paid</button><button type="button" data-p="dep" onclick="OT.pay(\'dep\')">Deposit</button><button type="button" data-p="full" onclick="OT.pay(\'full\')">Paid in full</button></div>'+
    '<div id="pdw" style="display:none"><label for="fpd">Amount paid (R)</label><input id="fpd" type="number" inputmode="decimal" min="0" step="any" value="'+(pay==='dep'?paid:'')+'" oninput="OT.calc()"></div>'+
    '<div class="owes" id="ow"></div>'+
    '<button type="button" class="more" onclick="OT.more()" id="mb">'+(more?'\u2212 Less':'+ More (optional)')+'</button>'+
    '<div id="mo" style="display:'+(more?'block':'none')+'"><label for="fdue">Due date</label><input id="fdue" type="date" value="'+esc(o&&o.due)+'"><label for="fnote">Notes</label><textarea id="fnote" rows="2">'+esc(o&&o.notes)+'</textarea><label for="fst">Status</label><select id="fst"><option value="todo">To Do</option><option value="ready">Ready</option><option value="done">Done</option></select></div>'+
    '<div class="err" id="er"></div><button class="save" onclick="OT.save()">Save Order</button>';
    open(h);if(o)$('#fst').value=o.status;OT.pay(pay);
    if(!o)setTimeout(function(){$('#fn').focus()},60);
  },
  more:function(){var m=$('#mo'),s=m.style.display==='none';m.style.display=s?'block':'none';$('#mb').textContent=s?'\u2212 Less':'+ More (optional)'},
  fill:function(){
    var n=$('#fn').value.trim().toLowerCase();if(!n||$('#fp').value)return;
    for(var i=orders.length-1;i>=0;i--)if(orders[i].name.toLowerCase()===n&&orders[i].phone){$('#fp').value=orders[i].phone;break}
  },
  pay:function(p){
    pay=p;document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
    $('#pdw').style.display=p==='dep'?'block':'none';OT.calc();
  },
  calc:function(){
    var price=+$('#fpr').value||0,paid=pay==='full'?price:pay==='dep'?Math.min(Math.max(+$('#fpd').value||0,0),price):0;
    var ow=Math.max(0,price-paid),el=$('#ow');
    el.textContent='Still owes: '+R(ow);el.className='owes'+(ow>0?'':' z');
    return paid;
  },
  save:function(){
    var name=$('#fn').value.trim(),item=$('#fi').value.trim(),er=$('#er');
    if(!name){er.textContent='Please add the customer\u2019s name.';$('#fn').focus();return}
    if(!item){er.textContent='Please say what they ordered.';$('#fi').focus();return}
    var price=Math.max(0,+$('#fpr').value||0),paid=OT.calc();
    var d={name:name,phone:$('#fp').value.trim(),item:item,price:price,paid:paid,due:$('#fdue').value,notes:$('#fnote').value.trim(),status:$('#fst').value};
    var o=editId?get(editId):null;
    if(o){for(var k in d)o[k]=d[k]}
    else{d.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);d.ordered=today();orders.push(d)}
    tab=d.status;save();close();render();window.scrollTo(0,0);buzz();toast('Order saved \u2713');
  },
  paid:function(id){act(id,'Marked as paid \u2713',function(o){o.paid=+o.price||0})},
  st:function(id,s){tab=s;act(id,'Moved to Ready \u2705',function(o){o.status=s})},
  collect:function(id){
    var o=get(id);if(!o)return;
    if(owes(o)>0&&!confirm(o.name+' still owes '+R(owes(o))+'. Mark as collected anyway?'))return;
    tab='done';act(id,'Moved to Done \uD83C\uDF89',function(o){o.status='done'});
  },
  del:function(id){var o=get(id);if(o&&confirm('Delete the order for '+o.name+'?')){orders=orders.filter(function(x){return x.id!==id});save();render()}},
  wa:function(id){
    var o=get(id);if(!o)return;var ow=owes(o),msg;
    if(o.status==='ready')msg='Hi '+o.name+', good news! Your order for '+o.item+' is ready for collection! '+(ow>0?'Still owes: '+R(ow)+eft(o):'Paid in full');
    else if(o.status==='todo')msg='Hi '+o.name+', just confirming your order for '+o.item+' - '+R(+o.price||0)+'.'+(o.due?' Due '+fd(o.due)+'.':'')+' Thank you!'+(ow>0?eft(o):'');
    else msg='Hi '+o.name+', thank you for your order! \uD83D\uDE0A';
    send(o,msg);
  },
  remind:function(id){
    var o=get(id);if(!o)return;
    send(o,'Hi '+o.name+', a friendly reminder: '+R(owes(o))+' is still owed for '+o.item+'. Thank you!'+eft(o));
  },
  cust:function(){
    var m={};
    orders.forEach(function(o){var k=o.name.trim().toLowerCase(),c=m[k]||(m[k]={name:o.name,phone:'',n:0,tot:0,owed:0});c.n++;c.tot+=+o.price||0;c.owed+=owes(o);if(o.phone)c.phone=o.phone});
    custList=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.tot-a.tot});
    var h='<div class="sh"><h2>My customers</h2><button class="x" onclick="OT.close()">Close</button></div>';
    if(!custList.length)h+='<div class="p">No customers yet. They appear here when you add orders.</div>';
    else h+='<div class="cl">'+custList.map(function(c,i){return '<div><b style="font-size:20px">'+esc(c.name)+'</b><br><span class="meta" style="margin:0">'+c.n+' order'+(c.n===1?'':'s')+' \u2022 '+R(c.tot)+' in total</span>'+(c.owed>0?'<br><b style="color:var(--red)">Owes '+R(c.owed)+'</b>':'')+'<div class="cb"><button onclick="OT.hi('+i+')">WhatsApp</button><button onclick="OT.newFor('+i+')">New order</button></div></div>'}).join('')+'</div>';
    open(h);
  },
  hi:function(i){var c=custList[i];if(c)send(c,'Hi '+c.name+' \uD83D\uDE42')},
  newFor:function(i){var c=custList[i];if(c)OT.form(null,{name:c.name,phone:c.phone})},
  owing:function(){
    var l=orders.filter(function(o){return owes(o)>0});
    open('<div class="sh"><h2>Who owes me?</h2><button class="x" onclick="OT.close()">Close</button></div><div class="owelist">'+l.map(function(o){return '<div><span><b>'+esc(o.name)+'</b><br><span class="meta" style="margin:0">'+esc(o.item)+'</span><br><button onclick="OT.remind(\''+o.id+'\')">Send reminder</button></span><b style="font-size:22px">'+R(owes(o))+'</b></div>'}).join('')+'</div>');
  },
  exp:function(){
    var b=new Blob([JSON.stringify({biz:biz,orders:orders},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-orders-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
    set.backup=today();put(K.s,JSON.stringify(set));toast('Backup downloaded \u2713');
  },
  impPick:function(){$('#imp').click()}
};
$('#imp').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result),list=Array.isArray(d)?d:d.orders;if(!Array.isArray(list))throw 0;
      var have={};orders.forEach(function(o){have[o.id]=1});var added=0;
      list.forEach(function(o){if(o&&o.id&&o.name&&!have[o.id]){o.status=['todo','ready','done'].indexOf(o.status)>-1?o.status:'todo';orders.push(o);added++}});
      if(d.biz&&!biz){biz=d.biz;put(K.b,biz)}
      save();close();render();alert(added?added+' order'+(added>1?'s':'')+' brought back.':'Those orders were already here.');
    }catch(x){alert('That file doesn\u2019t look like an orders backup.')}
    e.target.value='';
  };
  r.readAsText(f);
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e});
window.addEventListener('appinstalled',function(){deferred=null;standalone=true});
render();
try{if(!localStorage.getItem(K.h))OT.help(true)}catch(e){}
})();
</script>
</body>
</html>
